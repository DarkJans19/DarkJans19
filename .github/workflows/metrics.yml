
name: GitHub Profile Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS }}
          user: DarkJans19
          filename: metrics.svg
          base: ""

          # Coding habits
          plugin_habits: yes
          plugin_habits_charts: yes

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 5

          # Commit calendar
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # Featured repositories
          plugin_repositories: yes
          plugin_repositories_featured: DarkJans19/Deteccion_Fraude, Janh-Sanchez/GestionAcademicaMVC

          # LeetCode
          plugin_leetcode: yes
          plugin_leetcode_user: DarkJans19
          plugin_leetcode_sections: solved, skills
